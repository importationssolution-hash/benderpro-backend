name: Bender Pro Trading Bot
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run trading bot
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BENDER_WALLET: ${{ secrets.BENDER_WALLET }}
        run: node bot.js
